<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toy Town (new build)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3c4654;--paper:rgba(255,253,245,.82)}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe9fb;font-family:Nunito,system-ui,sans-serif;color:var(--ink)}
canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#chip{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));padding:6px 12px;border-radius:999px;background:var(--paper);font:600 13px/1.3 Nunito,system-ui,sans-serif}
#chip a{color:inherit;font-weight:400;margin-left:8px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:5px 12px;border-radius:999px;background:var(--paper);font:400 12px/1.3 Nunito,system-ui,sans-serif;transition:opacity .6s;max-width:calc(100vw - 32px);text-align:center}
#story{position:fixed;left:50%;transform:translateX(-50%);top:calc(52px + env(safe-area-inset-top,0px));max-width:min(86vw,560px);padding:6px 14px;border-radius:14px;background:var(--paper);font:600 13px/1.35 Nunito,system-ui,sans-serif;text-align:center;opacity:0;transition:opacity .6s;pointer-events:none}
#story small{display:block;font-weight:400;opacity:.8}
#story.on{opacity:1}
#card{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(46px + env(safe-area-inset-bottom,0px));min-width:200px;max-width:min(88vw,420px);padding:8px 34px 8px 14px;border-radius:14px;background:var(--paper);font:400 13px/1.4 Nunito,system-ui,sans-serif;opacity:0;pointer-events:none;transition:opacity .25s}
#card.on{opacity:1;pointer-events:auto}
#card b{display:block;font-weight:700;font-size:14px}
#card span{display:block}
#card button{position:absolute;right:6px;top:4px;width:26px;height:26px;border:0;border-radius:50%;background:transparent;color:inherit;font:700 18px/1 Nunito,system-ui,sans-serif;cursor:pointer}
#fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;background:#bfe9fb}
html.ui-off #chip,html.ui-off #hint,html.ui-off #story,html.ui-off #card{display:none}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="town" aria-label="Toy Town: a little storybook town with a clock tower, a teapot café and a windmill"></canvas>
<div id="chip">Toy Town · new build preview<a href="toy-town.html">current town</a></div>
<div id="story" aria-live="polite"></div>
<div id="card" aria-live="polite"><button aria-label="Close">×</button><b></b><div></div></div>
<div id="hint">Tap anyone or anything · drag to explore · pinch or scroll to zoom · twist (or right-drag, Q/E) to turn</div>
<div id="fail">The new town needs WebGL, which this browser could not start. <a href="toy-town.html">Open the current town</a>.</div>
<script>if(/[?&]clean=1\b/.test(location.search))document.documentElement.classList.add('ui-off');</script>
<script type="module">
  import('./assets/town2/main.mjs?v=3').catch(e => { console.error(e); document.getElementById('fail').style.display = 'flex'; });
</script>
</body>
</html>
