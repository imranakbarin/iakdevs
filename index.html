<script>
const requestedZen=location.hash.startsWith('#zen-'),requestedRoad=location.hash.startsWith('#road-'),requestedCozy=location.hash.startsWith('#cozy-'),requestedMushroom=location.hash.startsWith('#mushroom-island'),requestedPip=location.hash.startsWith('#pip-run');
// A shared Pip Run (#pip-run-<code>) opens that world with the sharer's run as a ghost.
let pipShared=location.hash.startsWith('#pip-run-')?location.hash.slice(9):'';
let artPresentation=location.hash.startsWith('#painting-')?'painted':'live';
const H=640,CW=600,RIVER=585,TAU=Math.PI*2,PI=Math.PI;
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(a,b){let h=Math.imul(a^0x9e3779b9,0x85ebca6b)^Math.imul((b+0x632be5ab)|0,0xc2b2ae35);h^=h>>>16;h=Math.imul(h,0x7feb352d);h^=h>>>15;return h>>>0;}
const pick=(r,a)=>a[r()*a.length|0],lerp=(a,b,t)=>a+(b-a)*t;
function shade(hex,d){const n=parseInt(hex.slice(1),16),R=n>>16,Gc=n>>8&255,B=n&255,f=(v)=>Math.max(0,Math.min(255,Math.round(v+d)));return'#'+((1<<24)+(f(R)<<16)+(f(Gc)<<8)+f(B)).toString(16).slice(1);}
function fillBody(c,rx,ry,base,bands){
  const ring=(k)=>{c.beginPath();c.ellipse(0,0,rx*k,ry*k,0,0,TAU);};
  for(let i=0;i<bands.length;i++){const k=1-i/bands.length;ring(k);c.fillStyle=i?bands[i]:base;c.fill();
    if(i===0){const g=c.createLinearGradient(0,-ry,0,ry);g.addColorStop(0,shade(base,28));g.addColorStop(.55,base);g.addColorStop(1,shade(base,-32));ring(k);c.fillStyle=g;c.fill();}
    ring(k);c.strokeStyle=T.mark;c.lineWidth=1.1;c.globalAlpha=.5;c.stroke();c.globalAlpha=1;
    const kk=k-.5/bands.length;if(kk>.1){c.beginPath();
      if(i%3===0)for(let a=0;a<TAU;a+=TAU/44)dot(c,Math.cos(a)*rx*kk,Math.sin(a)*ry*kk,1.3);
      else if(i%3===1)for(let a=0;a<TAU;a+=TAU/30){const x=Math.cos(a)*rx*kk,y=Math.sin(a)*ry*kk;c.moveTo(x,y);c.lineTo(x+Math.cos(a)*4,y+Math.sin(a)*4);}
      else for(let a=0;a<TAU;a+=TAU/26){const x=Math.cos(a)*rx*kk,y=Math.sin(a)*ry*kk;c.moveTo(x-2,y);c.arc(x,y,2.2,0,PI);}
      c.fillStyle=T.mark;c.strokeStyle=T.mark;c.lineWidth=1.1;i%3===0?c.fill():c.stroke();}

  if(modeBtn.value==='road'){roadFrame(SceneMotion.time*1000,dt);return;}
  const painted=artPresentation==='painted';
  const target=playing&&!drag?(painted?12.8:26)*(1-.7*ArtPresence.level(SceneMotion.time)):0;
  vel+=(target-vel)*(1-Math.exp(-dt*2.6));if(!drag&&playing)camX+=vel*dt;
  if(painted){LivingArt.draw(ctx,document.getElementById('sty').value,cv.width,cv.height,camX,SceneMotion.time,dt,seed);return;}
  ArtDepth.prepare(document.getElementById('sty').value);
  document.getElementById('art-status').hidden=true;
  if(document.getElementById('art-title').textContent!==ST.name)document.getElementById('art-title').textContent=ST.name;
  if(document.getElementById('art-medium').textContent!=='Live art · Endless landscape · Drag to explore')document.getElementById('art-medium').textContent='Live art · Endless landscape · Drag to explore';
  const k=S*DPR,vw=cv.clientWidth/S,camPx=Math.round(camX*k),cam=camPx/k;
  const a=Math.floor(cam/CW),b=Math.floor((cam+vw)/CW);
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=T.bg;ctx.fillRect(0,0,cv.width,cv.height);
  const tt=SceneMotion.time,acts=[];for(let i=a-1;i<=b+1;i++)for(const A of objs(i).actors)acts.push(A);
  const world=()=>ctx.setTransform(k,0,0,k,-camPx,-topY*k);
  const runActs=back=>{world();for(const A of acts)if(A.back===back&&A.plane!=='far'){ctx.save();A.fn(ctx,tt,mulberry32(A.s));ctx.restore();}ctx.setTransform(1,0,0,1,0,0);};
  if(ArtDepth.layered(ST)){
    const farCam=cam*.58,fa=Math.floor(farCam/CW),fb=Math.floor((farCam+vw)/CW);
    ctx.save();
    for(let i=fa;i<=fb;i++){if(!farTiles.has(i))farTiles.set(i,finish(tileJob(i,true)));{const dx=Math.round((i*CW-farCam)*k),w=Math.round(((i+1)*CW-farCam)*k)-dx;ctx.drawImage(farTiles.get(i),0,0,w,cv.height,dx,0,w,cv.height);}}
    for(const i of farTiles.keys())if(i<fa-1||i>fb+1)farTiles.delete(i);
    ctx.setTransform(k,0,0,k,-Math.round(farCam*k),-topY*k);
    for(let i=fa-1;i<=fb+1;i++)for(const A of objs(i).actors)if(A.plane==='far'){ctx.save();A.fn(ctx,tt,mulberry32(A.s));ctx.restore();}
    ctx.restore();
  }
  runActs(true);
  // Each tile is blitted only up to where its neighbour begins; the +2px padding
  // used to overlap and double any translucent paint along every seam.
  for(let i=a;i<=b;i++){const dx=Math.round(i*CW*k),w=Math.round((i+1)*CW*k)-dx;ctx.drawImage(needTile(i),0,0,w,cv.height,dx-camPx,0,w,cv.height);}
  if(ST.anim){world();ST.anim(ctx,cam-20,cam+vw+20,tt);ctx.setTransform(1,0,0,1,0,0);}
  if(ST.tintGrad){
    const tA=acts.filter(A=>!A.back&&!A.glow&&A.plane!=='far'),xa=cam-20,xb=cam+vw+20;
    if(tA.length){if(!fx||fx.width!==cv.width||fx.height!==cv.height){fx=document.createElement('canvas');fx.width=cv.width;fx.height=cv.height;fxc=fx.getContext('2d');}
      const run=()=>{fxc.setTransform(k,0,0,k,-camPx,-topY*k);for(const A of tA){fxc.save();A.fn(fxc,tt,mulberry32(A.s));fxc.restore();}};
      fxc.setTransform(1,0,0,1,0,0);fxc.clearRect(0,0,fx.width,fx.height);run();
      if(!ArtDepth.layered(ST)&&!ST.isDay(xa,xb)){fxc.globalCompositeOperation='source-atop';fxc.fillStyle=ST.atopCol((xa+xb)/2);fxc.setTransform(1,0,0,1,0,0);fxc.fillRect(0,0,fx.width,fx.height);fxc.globalCompositeOperation='source-over';}
      ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(fx,0,0);}
    world();for(const A of acts)if(!ArtDepth.layered(ST)&&!A.back&&A.glow){ctx.save();A.fn(ctx,tt,mulberry32(A.s));ctx.restore();}ctx.setTransform(1,0,0,1,0,0);
  }else runActs(false);
  ArtDepth.near(ctx,ST,document.getElementById('sty').value,cam,vw,k,cv.height);
  ArtDepth.light(ctx,ST,cam,vw,k,cv.height);
  ArtDepth.atmosphere(ctx,ST,cam,vw,k,cv.height,tt);
  if(ST.tintGrad&&ArtDepth.layered(ST)){world();for(const A of acts)if(!A.back&&A.glow){ctx.save();A.fn(ctx,tt,mulberry32(A.s));ctx.restore();}ctx.setTransform(1,0,0,1,0,0);}
  const fwd=vel>=0;pump(fwd?[b+1,b+2]:[a-1,b+1],4);
  for(const i of tiles.keys())if(i<a-2||i>b+2)tiles.delete(i);
  for(const i of jobs.keys())if(i<a-2||i>b+2)jobs.delete(i);
  const farA=Math.floor(cam*.58/CW),farB=Math.floor((cam*.58+vw)/CW);
  for(const i of OC.keys())if((i<a-5||i>b+5)&&(!ArtDepth.layered(ST)||i<farA-2||i>farB+2))OC.delete(i);

}
let frameHandle=0,lastPaint=0,lastMetrics=0;
function wakeScene(){SceneMotion.invalidate();if(!frameHandle&&!document.hidden)frameHandle=requestAnimationFrame(frame);}
function frame(t){
 frameHandle=0;if(document.hidden){last=t;return;}
 if(modeBtn.value==='cozy'||modeBtn.value==='mushroom'||modeBtn.value==='pip'){last=t;return;}
 if(modeBtn.value==='art'&&(cv.width!==Math.round(cv.clientWidth*DPR)||cv.height!==Math.round(cv.clientHeight*DPR)))layout();
  const dirty=SceneMotion.consumeDirty(),moving=playing||Boolean(drag),interval=cv.clientWidth<700||SceneMotion.renderMs>18?1000/30:1000/60;
 if(!dirty&&!moving)return;
 if(!dirty&&t-lastPaint<interval-.7){frameHandle=requestAnimationFrame(frame);return;}
 const dt=SceneMotion.advance((t-last)/1000,playing);last=t;lastPaint=t;
 const start=performance.now();drawScene(dt);const cost=performance.now()-start;
 if(SceneMotion.report(cost,interval>25?29:21))layout();
 if(t-lastMetrics>1000){cv.dataset.renderMs=SceneMotion.renderMs.toFixed(2);cv.dataset.pixelRatio=DPR.toFixed(2);lastMetrics=t;}
 if(moving)frameHandle=requestAnimationFrame(frame);
}
for(const event of ['input','change','click','keydown','pointerup','pointercancel'])document.addEventListener(event,wakeScene,{passive:true});
document.addEventListener('pointermove',()=>{if(drag)wakeScene();},{passive:true});
addEventListener('resize',wakeScene);
window.visualViewport?.addEventListener('resize',()=>{cancelArtDrag();layout();wakeScene();});
document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden){cancelArtDrag();cancelAnimationFrame(frameHandle);frameHandle=0;}else wakeScene();});

{const m=/^#(?:painting-)?(?:([a-z]+)-)?(\d+)/.exec(location.hash),key=m&&m[1]&&STYLES[m[1]]?m[1]:'gond';ST=STYLES[key];
 layout();setSeed(m?+m[2]:(Math.random()*1e6|0),key);syncPlay();}
LivingArt.setup();LivingArt.mode(!requestedZen&&!requestedRoad&&!requestedCozy&&!requestedMushroom&&!requestedPip);if(!requestedZen&&!requestedRoad&&!requestedCozy&&!requestedMushroom&&!requestedPip){setUI(true);document.getElementById('new').textContent='Another view';}
if(requestedZen||requestedRoad||requestedCozy||requestedMushroom||requestedPip){modeBtn.value=requestedPip?'pip':requestedMushroom?'mushroom':requestedCozy?'cozy':requestedZen?'zen':'road';modeBtn.onchange();}
// Editing the hash (or following a deep link in the same tab) opens that world;
// the app's own replaceState calls never fire hashchange.
addEventListener('hashchange',()=>location.reload());
ArtAmbience.install();ArtPresence.install();
motionPreference.addEventListener('change',e=>{if(e.matches){playing=false;syncPlay();if(modeBtn.value==='cozy')window.CozyWorlds?.pause();wakeScene();}});
wakeScene();
</script>
