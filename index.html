<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infinite World Scrolls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe0;--ink:#1b120c;--mark:#1b120c;--light:#fff8e8;--panel:rgba(246,239,224,.88);--ui:#1b120c;--line:rgba(27,18,12,.3);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d14;--ink:#0e0d14;--mark:#fff3d6;--light:#fff8e8;--panel:rgba(14,13,20,.82);--ui:#f3e6c6;--line:rgba(243,230,198,.28)}}
:root[data-theme="dark"]{--bg:#0e0d14;--ink:#0e0d14;--mark:#fff3d6;--light:#fff8e8;--panel:rgba(14,13,20,.82);--ui:#f3e6c6;--line:rgba(243,230,198,.28)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ui);overflow:hidden;font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.ui{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none;
  padding:calc(10px + env(safe-area-inset-top,0px)) 10px 0}
.bar{pointer-events:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:var(--panel);
  border:1.5px solid var(--line);border-radius:20px 6px 20px 6px;padding:8px 14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
h1{font:400 21px/1 "Yatra One",Georgia,serif;margin:0}
#seed{opacity:.6;font-variant-numeric:tabular-nums;font-size:12px}
button{font:inherit;color:inherit;background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
button:hover,select:hover{border-color:var(--ui)}
select{font:inherit;color:inherit;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer}
select:focus-visible{outline:2px solid var(--ui);outline-offset:2px}
button:focus-visible,input:focus-visible{outline:2px solid var(--ui);outline-offset:2px}
label{display:flex;align-items:center;gap:6px;font-size:12px}
input[type=range]{width:80px;accent-color:#E63B2E}
@media (max-width:520px){h1,#seed,label span{display:none}.bar{gap:8px;padding:8px 10px}input[type=range]{width:64px}}
.fab{pointer-events:auto;background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);width:40px;height:40px;padding:0;font-size:17px;line-height:1;margin-left:auto}
.ui:has(.fab:not([hidden])){justify-content:flex-end}
[hidden]{display:none!important}
.zen-mode{--panel:rgba(35,36,29,.82);--ui:#eee8d8;--line:rgba(232,222,200,.24);background:#25251f}.zen-mode .bar{border-radius:16px;font-family:system-ui,sans-serif}.zen-mode h1{font:400 19px/1.2 Georgia,serif}.zen-mode canvas{cursor:default}.zen-mode input[type=range]{accent-color:#b8bea0}
.zen-mode{height:100dvh}.zen-mode .bar{gap:8px;padding:8px 12px;border-width:1px;background:rgba(26,31,25,.76)}.zen-mode button,.zen-mode select{font:400 12px/1.4 system-ui,sans-serif;border-width:1px;background:rgba(255,255,255,.065)}.zen-mode select option{background:#252b24;color:#eee8d8}.zen-mode .ui{box-sizing:border-box}.zen-mode canvas{position:fixed;inset:0;width:100vw;height:100dvh}
@media(max-width:520px){.zen-mode .bar{gap:6px;padding:7px 8px;max-width:100%;border-radius:12px}.zen-mode button,.zen-mode select{padding:5px 8px}.zen-mode input[type=range]{width:48px}.zen-mode #zen-atmosphere{font-size:11px}}
</style>
</head>
<body>
<canvas id="c" aria-label="Endlessly scrolling art landscape inspired by traditional painting"></canvas>
<div class="ui"><div class="bar">
  <h1>Infinite scroll</h1>
<select id="mode" aria-label="Experience"><option value="art">World art</option><option value="road">Road trip</option><option value="zen">Zen garden</option></select>
  <select id="sty" aria-label="Art style"><option value="gond">India · Gond</option><option value="warli">Warli</option><option value="madhubani">Madhubani</option><option value="kangra">Kangra miniature</option><option value="japan">Japan · Woodblock inspired</option><option value="china">China · Ink landscape</option><option value="mexico">Mexico · Folk inspired</option></select>
  <select id="place" aria-label="Road trip place" hidden><option value="auto">Places · Auto</option><option value="0">Mountain pass</option><option value="1">Desert highway</option><option value="2">Forest trail</option><option value="3">Coastal drive</option><option value="4">City outskirts</option></select>
<button id="traffic" hidden aria-pressed="true">Traffic on</button>
<select id="weather" aria-label="Road trip weather" hidden><option value="auto">Weather · Auto</option><option value="sun">Sunny</option><option value="rain">Rain</option><option value="sunset">Sunset</option><option value="snow">Snow</option><option value="fog">Fog</option><option value="night">Night</option></select>
  <select id="zen-garden" aria-label="Garden environment" hidden><option value="moss">Moss sanctuary</option><option value="autumn">Autumn tea garden</option><option value="moon">Moonlit courtyard</option></select>
  <select id="zen-pattern" aria-label="Sand pattern" hidden><option value="spiral">Spiral</option><option value="petals">Lotus petals</option><option value="waves">Flowing waves</option><option value="random">Random · Freeform</option></select>
  <span id="seed"></span>
  <button id="play">Pause</button>
  <label>Speed <input id="spd" type="range" min="0" max="200" value="40"></label>
  <button id="new">New landscape</button>
  <button id="zen-atmosphere" aria-pressed="true" hidden>Atmosphere on</button>
  <button id="zen-fullscreen" hidden>Full screen</button>
  <button id="hide" aria-label="Hide controls" title="Hide controls (H)">Hide</button>
</div><button id="show" class="fab" hidden aria-label="Show controls" title="Show controls (H)">☰</button></div>
<div id="trip-status" hidden role="status" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel);padding:8px 18px;border-radius:30px;white-space:nowrap;pointer-events:none"></div>
<script src="assets/zen-garden.js?v=4"></script>
<script>
const requestedZen=location.hash.startsWith('#zen-');
const H=640,CW=600,RIVER=585,TAU=Math.PI*2,PI=Math.PI;
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(a,b){let h=Math.imul(a^0x9e3779b9,0x85ebca6b)^Math.imul((b+0x632be5ab)|0,0xc2b2ae35);h^=h>>>16;h=Math.imul(h,0x7feb352d);h^=h>>>15;return h>>>0;}
const pick=(r,a)=>a[r()*a.length|0],lerp=(a,b,t)=>a+(b-a)*t;
function shade(hex,d){const n=parseInt(hex.slice(1),16),R=n>>16,Gc=n>>8&255,B=n&255,f=(v)=>Math.max(0,Math.min(255,Math.round(v+d)));return'#'+((1<<24)+(f(R)<<16)+(f(Gc)<<8)+f(B)).toString(16).slice(1);}
function fillBody(c,rx,ry,base,bands){
  const ring=(k)=>{c.beginPath();c.ellipse(0,0,rx*k,ry*k,0,0,TAU);};
  for(let i=0;i<bands.length;i++){const k=1-i/bands.length;ring(k);c.fillStyle=i?bands[i]:base;c.fill();
    if(i===0){const g=c.createLinearGradient(0,-ry,0,ry);g.addColorStop(0,shade(base,28));g.addColorStop(.55,base);g.addColorStop(1,shade(base,-32));ring(k);c.fillStyle=g;c.fill();}
    ring(k);c.strokeStyle=T.mark;c.lineWidth=1.1;c.globalAlpha=.5;c.stroke();c.globalAlpha=1;
    const kk=k-.5/bands.length;if(kk>.1){c.beginPath();
      if(i%3===0)for(let a=0;a<TAU;a+=TAU/44)dot(c,Math.cos(a)*rx*kk,Math.sin(a)*ry*kk,1.3);
      else if(i%3===1)for(let a=0;a<TAU;a+=TAU/30){const x=Math.cos(a)*rx*kk,y=Math.sin(a)*ry*kk;c.moveTo(x,y);c.lineTo(x+Math.cos(a)*4,y+Math.sin(a)*4);}
      else for(let a=0;a<TAU;a+=TAU/26){const x=Math.cos(a)*rx*kk,y=Math.sin(a)*ry*kk;c.moveTo(x-2,y);c.arc(x,y,2.2,0,PI);}
      c.fillStyle=T.mark;c.strokeStyle=T.mark;c.lineWidth=1.1;i%3===0?c.fill():c.stroke();}
  }
}

const PAIRS=[['#2E933C','#F7B32B'],['#12A4B6','#F25F92'],['#E63B2E','#F7B32B'],['#2B59C3','#12A4B6'],['#F28C28','#2E933C'],['#D7263D','#F7B32B'],['#6A4C93','#F25F92'],['#7CB518','#12A4B6']];
const TRUNK=['#8B4A2B','#2B59C3','#6A4C93','#D7263D','#12A4B6','#B5651D'];
const HILL=['#2E933C','#12A4B6','#6A4C93','#7CB518','#2B59C3','#F28C28','#F25F92'];
const EARTH=[['#B5432B','#F7B32B'],['#8B4A2B','#F28C28'],['#D7263D','#F7B32B'],['#6A4C93','#F25F92']];
const WATER=['#2B59C3','#12A4B6'];
const BRIGHT=['#F7B32B','#E63B2E','#12A4B6','#F25F92','#2E933C','#2B59C3','#F28C28','#6A4C93'];
let T={};
const STYLES={};let ST;
const isDark=()=>matchMedia('(prefers-color-scheme: dark)').matches;
function readTheme(){T=ST.theme(isDark());document.body.style.background=T.bg;}

let seed,P,G,WC;
const gy=x=>505+14*Math.sin(x*.0043+P[0])+7*Math.sin(x*.012+P[1])+3*Math.sin(x*.031+P[2]);

/* geometry helpers */
function poly(c,p,close=true){c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)c.lineTo(p[i][0],p[i][1]);if(close)c.closePath();}
function quadPts(x0,y0,cx,cy,x1,y1,n){const p=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;p.push([u*u*x0+2*u*t*cx+t*t*x1,u*u*y0+2*u*t*cy+t*t*y1]);}return p;}
function taper(cl,w0,w1){const n=cl.length,L=[],R=[];for(let i=0;i<n;i++){const a=cl[Math.max(0,i-1)],b=cl[Math.min(n-1,i+1)],dx=b[0]-a[0],dy=b[1]-a[1],m=Math.hypot(dx,dy)||1,w=lerp(w0,w1,i/(n-1))/2;
  L.push([cl[i][0]-dy/m*w,cl[i][1]+dx/m*w]);R.push([cl[i][0]+dy/m*w,cl[i][1]-dx/m*w]);}return L.concat(R.reverse());}
function along(p,step,fn){let acc=step/2;for(let i=1;i<p.length;i++){const dx=p[i][0]-p[i-1][0],dy=p[i][1]-p[i-1][1],len=Math.hypot(dx,dy);
  while(acc<=len){const t=acc/len;fn(p[i-1][0]+dx*t,p[i-1][1]+dy*t,Math.atan2(dy,dx));acc+=step;}acc-=len;}}
function dot(c,x,y,r){c.moveTo(x+r,y);c.arc(x,y,r,0,TAU);}
function ink(c,lw){c.strokeStyle=T.ink;c.lineWidth=lw;c.stroke();}

/* motifs */
function leafPath(c,l,w){c.beginPath();c.moveTo(0,0);c.bezierCurveTo(w,-l*.25,w*.75,-l*.78,0,-l);c.bezierCurveTo(-w*.75,-l*.78,-w,-l*.25,0,0);c.closePath();}
function leaf(c,x,y,a,l,w,st,cA,cB){
  c.save();c.translate(x,y);c.rotate(a+PI/2);
  leafPath(c,l,w);{const g=c.createLinearGradient(-w,0,w,0);g.addColorStop(0,shade(cA,-20));g.addColorStop(.45,cA);g.addColorStop(1,shade(cA,34));c.fillStyle=g;}c.fill();c.save();c.clip();
  c.strokeStyle=T.mark;c.fillStyle=T.mark;c.lineWidth=1;
  if(st===0){c.beginPath();for(let t=.1;t<.95;t+=.075){const y0=-l*t;c.moveTo(0,y0);c.lineTo(w,y0+w*.8);c.moveTo(0,y0);c.lineTo(-w,y0+w*.8);}c.stroke();}
  else if(st===1){c.save();c.translate(0,-l*.1);leafPath(c,l*.76,w*.58);c.fillStyle=cB;c.fill();c.lineWidth=1.2;c.stroke();c.restore();
    c.beginPath();for(let t=.2;t<.86;t+=.085)dot(c,0,-l*t,Math.max(1,w*.09));c.fillStyle=T.mark;c.fill();
    c.beginPath();for(let t=.12;t<.9;t+=.08){dot(c,w*.5*Math.sin(t*PI)+.5,-l*t,1.1);dot(c,-w*.5*Math.sin(t*PI)-.5,-l*t,1.1);}c.fill();}
  else{c.fillStyle=cB;c.fillRect(0,-l,w,l);c.beginPath();for(let t=.06;t<1;t+=.06){c.moveTo(0,-l*t);c.lineTo(w,-l*t-w*.6);}c.stroke();
    c.beginPath();for(let t=.12;t<.9;t+=.09)dot(c,-w*.35,-l*t,1.3);c.fillStyle=T.mark;c.fill();}
  c.restore();
  if(st!==1){c.beginPath();c.moveTo(0,-1);c.lineTo(0,-l*.9);c.strokeStyle=T.mark;c.lineWidth=1.4;c.stroke();}
  leafPath(c,l,w);ink(c,2);
  c.restore();
}
function flower(c,x,y,r,cA,cB){
  for(let i=0;i<10;i++)leaf(c,x,y,i/10*TAU,r,r*.42,1,cA,cB);
  c.beginPath();c.arc(x,y,r*.45,0,TAU);c.fillStyle=cB;c.fill();ink(c,2);
  c.beginPath();for(let i=0;i<12;i++){const a=i/12*TAU;dot(c,x+Math.cos(a)*r*.32,y+Math.sin(a)*r*.32,1.2);}c.fillStyle=T.mark;c.fill();
  c.beginPath();c.arc(x,y,r*.14,0,TAU);c.fillStyle=T.ink;c.fill();
}
function* mound(c,cx,w,h,q){
  const base=560,A=pick(q,HILL);let B=pick(q,HILL);if(B===A)B=HILL[(HILL.indexOf(A)+2)%HILL.length];
  const hump=k=>{const p=[],hw=w/2*k,hh=h*k;for(let s=0;s<=48;s++){const u=-1+2*s/48;p.push([cx+u*hw,base-hh*Math.pow(1-u*u,.6)]);}return p;};
  poly(c,hump(1));c.fillStyle=A;c.fill();
  for(const [j,k] of [.78,.56,.34,.14].entries()){yield;
    const mid=hump(k+.11);c.strokeStyle=T.mark;c.fillStyle=T.mark;c.lineWidth=1.3;c.beginPath();
    if(j%2===0)along(mid,6.5,(x,y,a)=>{const nx=-Math.sin(a)*4,ny=Math.cos(a)*4;c.moveTo(x-nx,y-ny);c.lineTo(x+nx,y+ny);});
    else along(mid,7,(x,y)=>dot(c,x,y,1.6));
    j%2===0?c.stroke():c.fill();
    poly(c,hump(k));c.fillStyle=j%2?A:B;c.fill();ink(c,1.6);
  }
  poly(c,hump(1));ink(c,3);
}
function sun(c,x,y,rot=0){
  for(let i=0;i<16;i++){const a=i/16*TAU+rot;leaf(c,x+Math.cos(a)*34,y+Math.sin(a)*34,a,28,10,1,i%2?'#F7B32B':'#E63B2E',i%2?'#E63B2E':'#F7B32B');}
  [[38,'#F7B32B'],[29,'#F28C28'],[20,'#F7B32B'],[10,'#E63B2E']].forEach(([r,col])=>{c.beginPath();c.arc(x,y,r,0,TAU);c.fillStyle=col;c.fill();ink(c,r===38?3:1.5);});
  c.beginPath();for(let i=0;i<36;i++){const a=i/36*TAU;dot(c,x+Math.cos(a)*33.5,y+Math.sin(a)*33.5,1.5);}
  for(let i=0;i<20;i++){const a=i/20*TAU;dot(c,x+Math.cos(a)*15,y+Math.sin(a)*15,1.3);}c.fillStyle=T.mark;c.fill();
}
function trunkPattern(c,L,R,st){
  const m=7;c.strokeStyle=T.mark;c.lineWidth=1.3;c.beginPath();
  if(st===0){for(let k=1;k<m;k++)for(let i=0;i<L.length;i++){const x=lerp(L[i][0],R[i][0],k/m)+Math.sin(i*.8+k*1.3)*1.6;i?c.lineTo(x,L[i][1]):c.moveTo(x,L[i][1]);}c.stroke();}
  else if(st===1){for(let i=0;i<L.length;i++){const r=(R[i][0]-L[i][0])/m/2;for(let k=-1;k<m;k++){const x=lerp(L[i][0],R[i][0],(k+.5+(i%2)*.5)/m);c.moveTo(x+r,L[i][1]);c.arc(x,L[i][1],r,0,PI,true);}}c.stroke();}
  else{for(let i=1;i<L.length;i+=2){c.moveTo(L[i][0],L[i][1]);for(let k=1;k<=m*2;k++)c.lineTo(lerp(L[i][0],R[i][0],k/(m*2)),L[i][1]+(k%2?-3.5:0));}c.stroke();
    c.beginPath();for(let i=0;i<L.length;i+=2)for(let k=1;k<m;k++)dot(c,lerp(L[i][0],R[i][0],k/m),L[i][1]-1.5,1.3);c.fillStyle=T.light;c.fill();}
}
function* tree(c,x,q){
  const y0=gy(x)+4,h=150+q()*110,w=34+q()*22,tx=x+(q()-.5)*44,ty=y0-h,wt=w*.5,bend=(q()-.5)*34;
  const tcol=pick(q,TRUNK),pair=pick(q,PAIRS),ls=q()*3|0,flw=q()<.2,tst=q()*3|0;
  const N=26,L=[],R=[];
  for(let i=0;i<=N;i++){const t=i/N,cx=lerp(x,tx,t)+Math.sin(t*PI)*bend,ww=lerp(w,wt,Math.pow(t,.7))+Math.max(0,.15-t)*w*2.6,yy=lerp(y0,ty,t);L.push([cx-ww/2,yy]);R.push([cx+ww/2,yy]);}
  const trunk=L.concat(R.slice().reverse()),polys=[],cls=[],tips=[],mids=[];
  for(let k=0,nr=2+(q()*3|0);k<nr;k++){const sd=k%2?1:-1,len=24+q()*34,bx=x+sd*w*.25;const cl=quadPts(bx,y0-8,bx+sd*len*.6,y0+4,bx+sd*len,y0-4-q()*10,8);polys.push(taper(cl,w*.34,3));}
  const br=(px,py,a,len,w0,d)=>{let a2=Math.max(-PI-.25,Math.min(.25,a+(q()-.5)*.6));const ex=px+Math.cos(a2)*len,ey=py+Math.sin(a2)*len;
    const cl=quadPts(px,py,px+Math.cos(a)*len*.5,py+Math.sin(a)*len*.5,ex,ey,10);polys.push(taper(cl,w0,w0*.7));cls.push(cl);
    if(d===0){tips.push([ex,ey,a2]);return;}mids.push([ex,ey,a2]);
    const k=q()<.3?3:2;for(let i=0;i<k;i++)br(ex,ey,a2+(i-(k-1)/2)*(.55+q()*.3)+(q()-.5)*.15,len*(.72+q()*.1),w0*.68,d-1);};
  const n=2+(q()*2|0),dep=h>215?3:2;
  for(let i=0;i<n;i++)br(tx,ty+10,-PI/2+(i-(n-1)/2)*(.6+q()*.3)+(q()-.5)*.2,52+q()*30,wt*.72,dep);
  c.lineJoin='round';c.lineCap='round';
  for(const p of polys){poly(c,p);ink(c,5);}poly(c,trunk);ink(c,5);
  c.fillStyle=shade(tcol,-12);for(const p of polys){poly(c,p);c.fill();}
  {let mn=1e9,mx=-1e9;for(const p of trunk){mn=Math.min(mn,p[0]);mx=Math.max(mx,p[0]);}const g=c.createLinearGradient(mn,0,mx,0);
   g.addColorStop(0,shade(tcol,-40));g.addColorStop(.4,shade(tcol,22));g.addColorStop(.7,tcol);g.addColorStop(1,shade(tcol,-34));poly(c,trunk);c.fillStyle=g;c.fill();}
  c.setLineDash([4,4]);c.strokeStyle=T.mark;c.lineWidth=1.3;for(const cl of cls){poly(c,cl,false);c.stroke();}c.setLineDash([]);
  c.save();poly(c,trunk);c.clip();trunkPattern(c,L,R,tst);c.restore();
  for(const [mx,my,a] of mids){yield;for(const s of[-1,1])leaf(c,mx,my,a+s*.95,26+q()*10,10+q()*4,ls,pair[s>0?0:1],pair[s>0?1:0]);}
  for(const [ex,ey,a] of tips){yield;
    if(flw){leaf(c,ex,ey,a-.9,26,10,ls,pair[0],pair[1]);leaf(c,ex,ey,a+.9,26,10,ls,pair[0],pair[1]);flower(c,ex,ey,17+q()*6,pair[1],pair[0]);continue;}
    const m=4+(q()*3|0);for(let j=0;j<m;j++)leaf(c,ex,ey,a+(j/(m-1)-.5)*2.2+(q()-.5)*.15,36+q()*18,14+q()*6,ls,pair[j%2],pair[(j+1)%2]);
  }
  if(q()<.4&&tips.length){const t=tips[q()*tips.length|0];bird(c,t[0],t[1]-18,q()<.5?1:-1,.95,q,false);}
}
function bird(c,x,y,dir,s,q,fly,fl=0){

/* Seeded shan-shui drawing grammar. Every world coordinate owns its details. */
function inkMass(c,x,y,w,h,q,col,detail=1){
 c.save();c.translate(x,y);
 const skew=(q()-.5)*w*.18,crest=[],peakAt=.35+q()*.3,phase=q()*TAU;
 for(let i=0;i<=34;i++){
  const u=i/34,peak=Math.max(0,1-Math.abs((u-peakAt)/(u<peakAt?peakAt:1-peakAt)))**.62;
  crest.push([-w/2+u*w+skew*peak,-h*peak*(.93+q()*.05+Math.sin(u*19+phase)*.045)]);
 }
 const shape=[[-w/2,8],...crest,[w/2,8]];
 poly(c,shape);const wash=c.createLinearGradient(-w*.3,-h,w*.35,15);
 wash.addColorStop(0,shade(col,-12));wash.addColorStop(.45,col);wash.addColorStop(1,'#e4dfcc');c.fillStyle=wash;c.fill();
 c.save();poly(c,shape);c.clip();
 // Fractured faces, not repeated triangular mountain silhouettes.
 for(let f=0;f<24;f++){
  const i=2+(q()*29|0),p=crest[i],end=p[0]+(q()-.5)*w*.45;
  poly(c,[[p[0],p[1]],[p[0]+15+q()*22,p[1]+q()*h*.22],[end,-q()*h*.1],[end-20-q()*35,8]]);
  c.fillStyle=f%3?'rgba(44,66,60,.055)':'rgba(247,241,220,.2)';c.fill();
 }
 for(let j=0;j<Math.round(75*detail);j++){
  const p=crest[2+(q()*30|0)],ex=p[0]+(q()-.5)*w*.38,ey=-h*q()*.15;
  c.beginPath();c.moveTo(p[0],p[1]+q()*10);c.bezierCurveTo(p[0]-15+q()*30,p[1]+h*.24,ex+q()*30,ey-h*.2,ex,ey);
  artStroke(c,j%4?'rgba(42,63,57,.15)':'rgba(35,54,49,.29)',.35+q()*1.5);
 }
 for(let j=0;j<Math.round(1400*detail);j++){
  const xx=(q()-.5)*w,yy=-q()*h,len=2+q()*13;
  c.beginPath();c.moveTo(xx,yy);c.lineTo(xx+len*.3,yy+len);c.lineTo(xx+len*.8,yy+len*.8);
  artStroke(c,j%5?'rgba(43,63,57,.1)':'rgba(43,63,57,.25)',.3+q()*1.1);
 }
 for(let j=0;j<Math.round(190*detail);j++){
  c.fillStyle=j%3?'rgba(62,80,58,.23)':'rgba(42,55,43,.33)';c.beginPath();c.ellipse((q()-.5)*w,-q()*h,1+q()*3,.5+q()*1.5,q(),0,TAU);c.fill();
 }
 c.restore();poly(c,crest,false);artStroke(c,'rgba(51,70,62,.38)',.7);
 c.save();poly(c,shape);c.clip();
 const fade=c.createLinearGradient(0,-h*.23,0,12);fade.addColorStop(0,'rgba(238,232,216,0)');fade.addColorStop(1,'rgba(238,232,216,.94)');c.fillStyle=fade;c.fillRect(-w/2,-h*.23,w,h*.23+15);
 c.restore();c.restore();
}

 };

  for(const o of all)if(o.layer>=2&&o.layer<6){yield* draw(o);yield;}
  if(ST.over){ST.over(c,xa,xb);yield;}
  for(const o of all)if(o.layer>=6){yield* draw(o);yield;}
  return t;
}
function finish(j){let r;while(!(r=j.next()).done);return r.value;}
function renderTile(i){return finish(tileJob(i));}
function needTile(i){if(!tiles.has(i)){const j=jobs.get(i);tiles.set(i,j?finish(j):renderTile(i));jobs.delete(i);}return tiles.get(i);}
function pump(order,budget){const t0=performance.now();
  for(const i of order){if(tiles.has(i))continue;let j=jobs.get(i);if(!j){j=tileJob(i);jobs.set(i,j);}
    while(performance.now()-t0<budget){const r=j.next();if(r.done){tiles.set(i,r.value);jobs.delete(i);break;}}
    if(performance.now()-t0>=budget)return;}}
function resetTiles(){tiles.clear();jobs.clear();}
function setSeed(s,key){
  const previousStyle=ST;if(key&&STYLES[key])ST=STYLES[key];readTheme();
  if(previousStyle!==ST&&(previousStyle===STYLES.china||ST===STYLES.china||previousStyle===STYLES.japan||ST===STYLES.japan))layout();
  seed=s>>>0;const r=mulberry32(seed);P=Array.from({length:4},()=>r()*TAU);ST.init(r);
  OC.clear();resetTiles();camX=0;document.getElementById('seed').textContent='#'+seed;
  document.getElementById('sty').value=key||document.getElementById('sty').value;
  const k=Object.keys(STYLES).find(n=>STYLES[n]===ST);
  try{history.replaceState(null,'','#'+k+'-'+seed);}catch(e){}
}
let speed=40,playing=true,drag=null,last=performance.now(),vel=0,dragV=0;
const playBtn=document.getElementById('play'),syncPlay=()=>playBtn.textContent=playing?'Pause':'Play';
playBtn.onclick=()=>{playing=!playing;syncPlay();};
document.getElementById('spd').oninput=e=>speed=+e.target.value;
document.getElementById('new').onclick=()=>{if(modeBtn.value==='zen'){zenReset();return;}journey=0;setSeed(Math.random()*1e6|0);};
document.getElementById('sty').onchange=e=>setSeed(seed,e.target.value);
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,c:camX,lx:e.clientX,lt:performance.now()};dragV=0;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';});
cv.addEventListener('pointermove',e=>{if(!drag)return;camX=drag.c-(e.clientX-drag.x)/S;const now=performance.now(),dtm=Math.max(1,now-drag.lt);dragV=dragV*.6+(-(e.clientX-drag.lx)/S/dtm*1000)*.4;drag.lx=e.clientX;drag.lt=now;});
const endDrag=()=>{if(drag&&performance.now()-drag.lt<90)vel=Math.max(-2500,Math.min(2500,dragV));drag=null;cv.style.cursor='';};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('wheel',e=>{camX+=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)/S;e.preventDefault();},{passive:false});
addEventListener('resize',layout);
const bar=document.querySelector('.bar'),showBtn=document.getElementById('show');
function setUI(on){bar.hidden=!on;showBtn.hidden=on;try{localStorage.setItem('gond-ui',on?'1':'0');}catch(e){}}
document.getElementById('hide').onclick=()=>{setUI(false);showBtn.focus();};
showBtn.onclick=()=>{setUI(true);document.getElementById('hide').focus();};
addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H')setUI(bar.hidden);else if(e.key===' '&&e.target===document.body){playing=!playing;syncPlay();e.preventDefault();}});
try{if(localStorage.getItem('gond-ui')==='0')setUI(false);}catch(e){}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readTheme();OC.clear();resetTiles();});

const modeBtn=document.getElementById('mode');
modeBtn.onchange=()=>{
 const road=modeBtn.value==='road',zen=modeBtn.value==='zen',wasZen=document.body.classList.contains('zen-mode');
 document.body.classList.toggle('zen-mode',zen);
 document.getElementById('sty').hidden=road||zen;document.getElementById('seed').hidden=road||zen;
 document.getElementById('zen-pattern').hidden=!zen;
 for(const id of ['zen-garden','zen-atmosphere','zen-fullscreen'])document.getElementById(id).hidden=!zen;
 if(zen!==wasZen)layout();
 for(const id of ['place','weather','trip-status','traffic'])document.getElementById(id).hidden=!road;
 document.querySelector('h1').textContent=zen?'Zen garden':'Infinite scroll';
 document.getElementById('new').textContent=zen?'Smooth sand':'New landscape';
 cv.setAttribute('aria-label',zen?'A steel ball slowly carves sand patterns in a full-screen garden with moving foliage, soft light and incense smoke':road?'Infinite illustrated road trip through changing places and weather':'Endlessly scrolling world art landscape');
 if(zen){if(!zenReady)zenReset();history.replaceState(null,'','#zen-'+seed);}
 else if(location.hash.startsWith('#zen-'))history.replaceState(null,'','#'+document.getElementById('sty').value+'-'+seed);
};
 document.getElementById('zen-pattern').onchange=()=>zenReset();
document.getElementById('zen-garden').onchange=e=>zenSetGarden(e.target.value);
document.getElementById('zen-atmosphere').onclick=e=>{zenAtmosphere=!zenAtmosphere;e.target.setAttribute('aria-pressed',String(zenAtmosphere));e.target.textContent=zenAtmosphere?'Atmosphere on':'Atmosphere off';};
const zenFullscreen=document.getElementById('zen-fullscreen');
if(!document.documentElement.requestFullscreen)zenFullscreen.textContent='Focus view';
zenFullscreen.onclick=async()=>{
 if(!document.documentElement.requestFullscreen){setUI(false);return;}
 try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}
 catch(e){setUI(false);}
};
document.addEventListener('fullscreenchange',()=>{zenFullscreen.textContent=document.fullscreenElement?'Exit full screen':'Full screen';layout();});
document.getElementById('traffic').onclick=e=>{trafficEnabled=!trafficEnabled;e.target.textContent=trafficEnabled?'Traffic on':'Traffic off';e.target.setAttribute('aria-pressed',String(trafficEnabled));};
function frame(t){
  const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;
  if(modeBtn.value==='zen'){zenFrame(dt);requestAnimationFrame(frame);return;}
  if(modeBtn.value==='road'){roadFrame(t,dt);requestAnimationFrame(frame);return;}
  const target=playing&&!drag?speed:0;vel+=(target-vel)*(1-Math.exp(-dt*(Math.abs(vel)>speed*1.5?1.6:2.6)));
  if(!drag)camX+=vel*dt;
  if(ST===STYLES.mexico&&renderPaintedPanorama(mexicanPanorama)){requestAnimationFrame(frame);return;}
  const k=S*DPR,vw=cv.clientWidth/S,camPx=Math.round(camX*k),cam=camPx/k;
  const a=Math.floor(cam/CW),b=Math.floor((cam+vw)/CW);
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=T.bg;ctx.fillRect(0,0,cv.width,cv.height);
  const tt=t/1000,acts=[];for(let i=a-1;i<=b+1;i++)for(const A of objs(i).actors)acts.push(A);
  const world=()=>ctx.setTransform(k,0,0,k,-camPx,-topY*k);
  const runActs=back=>{world();for(const A of acts)if(A.back===back){ctx.save();A.fn(ctx,tt,mulberry32(A.s));ctx.restore();}ctx.setTransform(1,0,0,1,0,0);};
  runActs(true);
  for(let i=a;i<=b;i++)ctx.drawImage(needTile(i),Math.round(i*CW*k)-camPx,0);
  if(ST.anim){world();ST.anim(ctx,cam-20,cam+vw+20,tt);ctx.setTransform(1,0,0,1,0,0);}
  if(ST.tintGrad){
    const tA=acts.filter(A=>!A.back&&!A.glow),xa=cam-20,xb=cam+vw+20;
    if(tA.length){if(!fx||fx.width!==cv.width||fx.height!==cv.height){fx=document.createElement('canvas');fx.width=cv.width;fx.height=cv.height;fxc=fx.getContext('2d');}
      const run=()=>{fxc.setTransform(k,0,0,k,-camPx,-topY*k);for(const A of tA){fxc.save();A.fn(fxc,tt,mulberry32(A.s));fxc.restore();}};
      fxc.setTransform(1,0,0,1,0,0);fxc.clearRect(0,0,fx.width,fx.height);run();
      if(!ST.isDay(xa,xb)){fxc.globalCompositeOperation='source-atop';fxc.fillStyle=ST.atopCol((xa+xb)/2);fxc.setTransform(1,0,0,1,0,0);fxc.fillRect(0,0,fx.width,fx.height);fxc.globalCompositeOperation='source-over';}
      ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(fx,0,0);}
    world();for(const A of acts)if(!A.back&&A.glow){ctx.save();A.fn(ctx,tt,mulberry32(A.s));ctx.restore();}ctx.setTransform(1,0,0,1,0,0);
  }else runActs(false);
  const fwd=vel>=0;pump(fwd?[b+1,b+2]:[a-1,b+1],4);
  for(const i of tiles.keys())if(i<a-2||i>b+2)tiles.delete(i);
  for(const i of jobs.keys())if(i<a-2||i>b+2)jobs.delete(i);
  for(const i of OC.keys())if(i<a-5||i>b+5)OC.delete(i);
  requestAnimationFrame(frame);
}
{const m=/^#(?:([a-z]+)-)?(\d+)/.exec(location.hash),key=m&&m[1]&&STYLES[m[1]]?m[1]:'gond';ST=STYLES[key];
 layout();setSeed(m?+m[2]:(Math.random()*1e6|0),key);syncPlay();}
if(requestedZen){modeBtn.value='zen';modeBtn.onchange();}
requestAnimationFrame(frame);
</script>
