<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toy Town</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#bfe6f7;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
#town{display:block;width:100%;height:100%;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#town-3d{display:none;position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#town-3d canvas{filter:saturate(1.42) contrast(1.11)}
/* Lens finishing stays behind the UI and never intercepts phone gestures. */
#town-3d::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 46% 34%,rgba(255,239,211,.04),transparent 66%),radial-gradient(ellipse at 50% 48%,transparent 43%,rgba(40,54,59,.075) 100%);}

#card,#ticker,#hint,#zoom-controls{z-index:3}
html.embedded #zoom-controls{display:none}
#card{position:fixed;left:14px;top:calc(72px + env(safe-area-inset-top,0px));width:min(354px,calc(100vw - 28px));box-sizing:border-box;padding:12px 14px;border-radius:16px;background:rgba(255,253,245,.94);box-shadow:0 9px 30px rgba(30,50,70,.19);color:#2d3440;pointer-events:auto;backdrop-filter:blur(12px)}
#news-toggle{display:flex;align-items:center;justify-content:space-between;gap:9px;width:100%;margin-top:9px;padding:8px 10px;background:#235d61;color:#fff;border:0;border-radius:10px;text-align:left;cursor:pointer;font:800 11px/1.2 system-ui;letter-spacing:.03em}
#news-toggle:focus-visible,.headline-item:focus-visible{outline:2px solid #f6b554;outline-offset:2px}
#news-headline{font:600 12px/1.35 system-ui;color:#314e53;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#news-panel:not([hidden]){display:grid;gap:5px;margin-top:9px;max-height:min(45vh,340px);overflow-y:auto;border-top:1px solid #d5d8ce;padding-top:6px}
#news-panel[hidden]{display:none}
.headline-item{display:grid;gap:4px;padding:9px 5px;text-decoration:none;color:#2d3440;border-bottom:1px solid #e6e3d9}
.headline-title{font:700 12.5px/1.32 system-ui}
.headline-item small{font:600 10.5px/1.25 system-ui;color:#64767a}
.headline-item:hover .headline-title{text-decoration:underline}
#card .k{font:700 10.5px/1 system-ui;letter-spacing:.14em;text-transform:uppercase;color:#d0543a}
#card .t{font:800 19px/1.2 system-ui;margin:5px 0 2px}
#card .n{font-size:12px;color:#5d6675;line-height:1.35}
#ticker{position:fixed;left:0;right:0;bottom:0;padding:9px 14px calc(9px + env(safe-area-inset-bottom,0px));background:#d0543a;color:#fff;font:700 13.5px/1.3 system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#ticker b{background:#fff;color:#d0543a;border-radius:4px;padding:1px 6px;margin-right:9px;font-size:11px;letter-spacing:.08em}
#hint{position:fixed;right:14px;bottom:calc(119px + env(safe-area-inset-bottom,0px));padding:6px 11px;border-radius:999px;background:rgba(45,52,64,.75);color:#fff;font:600 12px system-ui;pointer-events:none;transition:opacity 1s}
#zoom-controls{position:fixed;right:14px;bottom:calc(53px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:4px;border-radius:18px;background:rgba(45,52,64,.82);box-shadow:0 4px 14px rgba(0,0,0,.14)}
#zoom-controls button{border:0;border-radius:13px;min-width:39px;height:38px;background:rgba(255,255,255,.11);color:#fffdf6;font:700 21px/1 system-ui;cursor:pointer;touch-action:manipulation}
#zoom-controls button:active{background:rgba(255,255,255,.32)}
#zoom-controls button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#zoom-controls #zoom-reset{font-size:12px;letter-spacing:.01em;min-width:43px}
@media (max-width:600px){#card{top:calc(64px + env(safe-area-inset-top,0px));padding:8px 12px}#card .t{font-size:16px}}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="town" aria-label="Toy Town: a busy little isometric town"></canvas>
<div id="town-3d" aria-hidden="true"></div>
<div id="card"><div class="k">Toy Town · <span id="date"></span></div><div class="t" id="theme">Opening the town…</div><div class="n" id="news"></div>
  <button id="news-toggle" type="button" aria-controls="news-panel" aria-expanded="false"><span id="news-status">CHECKING HEADLINES</span><span aria-hidden="true">↗</span></button>
  <div id="news-headline" role="status">Checking publisher updates…</div>
  <section id="news-panel" aria-label="Publisher headlines" hidden><div id="headlines"></div></section>
</div>
<div id="ticker" role="log" aria-live="polite"><b>AROUND TOWN · FICTION</b><span id="tick">Good morning, Toy Town!</span></div>
<div id="hint">Drag to explore · pinch or scroll to zoom · tap for a surprise</div>
<div id="zoom-controls" role="group" aria-label="City zoom">
  <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
  <button id="zoom-reset" type="button" aria-label="Reset city view" title="Fit city">Fit</button>
  <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
</div>
<script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embedded');</script>
<script src="assets/toy-town-diorama.js?v=1"></script>
<script src="assets/toy-town-news.js?v=1"></script>
<script src="assets/toy-town.js?v=25"></script>
<script type="module">
  // Opt out with ?classic=1 for the original Canvas experience.
  // Loading errors are deliberately isolated from the existing town engine.
  if (!new URLSearchParams(location.search).has('classic') && window.WebGL2RenderingContext) {
    Promise.all([
      import('three'),
      import('three/addons/geometries/RoundedBoxGeometry.js'),
      import('./assets/toy-town-3d.js?v=37'),
      import('./assets/toy-town-landmarks.js?v=7')
    ]).then(([THREE, geometry, view, landmarks]) => {
      try { view.mountToyTown3D(THREE, geometry.RoundedBoxGeometry, ToyTown,
        document.getElementById('town-3d'),{buildLandmark:landmarks.buildLandmark}); }
      catch (error) { console.warn('3D is unavailable; classic Toy Town remains active',error); }
    }).catch(error => console.warn('3D resources unavailable; using the 2D town',error));
  }
</script>
</body>
</html>
