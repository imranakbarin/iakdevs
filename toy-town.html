<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toy Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#bfe6f7;font-family:Nunito,system-ui,-apple-system,sans-serif;touch-action:none}
#town{display:block;width:100%;height:100%;cursor:pointer}
#card{position:fixed;left:14px;top:calc(72px + env(safe-area-inset-top,0px));max-width:min(360px,calc(100vw - 28px));padding:10px 14px 9px;border-radius:14px;background:rgba(255,253,245,.92);box-shadow:0 6px 20px rgba(30,50,70,.18);color:#2d3440;pointer-events:none}
#card .k{font:600 10.5px/1 Nunito,system-ui;letter-spacing:.12em;text-transform:uppercase;color:#d0543a}
#card .t{font:600 18px/1.25 Nunito,system-ui;margin:5px 0 2px}
#card .n{font:400 12.5px/1.4 Nunito,system-ui;color:#5d6675}
#ticker{position:fixed;left:0;right:0;bottom:0;padding:9px 14px calc(9px + env(safe-area-inset-bottom,0px));background:#d0543a;color:#fff;font:500 13.5px/1.3 Nunito,system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#ticker b{background:#fff;color:#d0543a;border-radius:4px;padding:1px 6px;margin-right:9px;font-size:11px;font-weight:600;letter-spacing:.08em}
#hint{position:fixed;right:14px;bottom:calc(50px + env(safe-area-inset-bottom,0px));padding:6px 11px;border-radius:999px;background:rgba(45,52,64,.75);color:#fff;font:500 12px Nunito,system-ui;pointer-events:none;transition:opacity 1s}
@media (max-width:600px){#card{top:calc(64px + env(safe-area-inset-top,0px));padding:8px 12px}#card .t{font-size:16px}}
</style>
</head>
<body>
<canvas id="town" aria-label="Toy Town: a busy little isometric town"></canvas>
<div id="card" role="status"><div class="k">Toy Town · <span id="date"></span></div><div class="t" id="theme">Opening the town…</div><div class="n" id="news"></div></div>
<div id="ticker" role="log" aria-live="polite"><b>TOY TOWN NEWS</b><span id="tick">Good morning, Toy Town!</span></div>
<div id="hint">Tap a person to chat · tap anywhere to poke · drag to look around</div>
<script src="assets/toy-town.js?v=8"></script>
</body>
</html>
