<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toy Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#bfe6f7;font-family:Nunito,system-ui,-apple-system,sans-serif;touch-action:none}
#town{display:block;width:100%;height:100%;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#town-3d{display:none;position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#town-3d canvas{filter:saturate(1.42) contrast(1.11)}
#town-3d.lens canvas{filter:saturate(1.3) contrast(1.08)}
#town-3d.lens::after{display:none}
/* Lens finishing stays behind the UI and never intercepts phone gestures. */
#town-3d::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 46% 34%,rgba(255,239,211,.04),transparent 66%),radial-gradient(ellipse at 50% 48%,transparent 43%,rgba(40,54,59,.075) 100%);}

#card,#ticker,#hint,#zoom-controls{z-index:3}
html.embedded #zoom-controls{display:none}
#card{position:fixed;left:14px;top:calc(72px + env(safe-area-inset-top,0px));width:min(354px,calc(100vw - 28px));box-sizing:border-box;padding:12px 14px;border-radius:16px;background:rgba(255,253,245,.94);box-shadow:0 9px 30px rgba(30,50,70,.19);color:#2d3440;pointer-events:auto;backdrop-filter:blur(12px)}
#news-toggle{display:flex;align-items:center;justify-content:space-between;gap:9px;width:100%;margin-top:9px;padding:8px 10px;background:#235d61;color:#fff;border:0;border-radius:10px;text-align:left;cursor:pointer;font:600 11px/1.2 Nunito,system-ui;letter-spacing:.03em}
#news-toggle:focus-visible,.headline-item:focus-visible{outline:2px solid #f6b554;outline-offset:2px}
#news-headline{font:500 12px/1.35 Nunito,system-ui;color:#314e53;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#news-panel:not([hidden]){display:grid;gap:5px;margin-top:9px;max-height:min(45vh,340px);overflow-y:auto;border-top:1px solid #d5d8ce;padding-top:6px}
#news-panel[hidden]{display:none}
.headline-item{display:grid;gap:4px;padding:9px 5px;text-decoration:none;color:#2d3440;border-bottom:1px solid #e6e3d9}
.headline-title{font:600 12.5px/1.32 Nunito,system-ui}
.headline-item small{font:500 10.5px/1.25 Nunito,system-ui;color:#64767a}
.headline-item:hover .headline-title{text-decoration:underline}
#card .k{font:600 10.5px/1 Nunito,system-ui;letter-spacing:.14em;text-transform:uppercase;color:#d0543a}
#card .t{font:600 19px/1.2 Nunito,system-ui;margin:5px 0 2px}
#card .n{font:400 12.5px/1.4 Nunito,system-ui;color:#5d6675}
#ticker{position:fixed;left:0;right:0;bottom:0;padding:9px 14px calc(9px + env(safe-area-inset-bottom,0px));background:#d0543a;color:#fff;font:500 13.5px/1.3 Nunito,system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#ticker b{background:#fff;color:#d0543a;border-radius:4px;padding:1px 6px;margin-right:9px;font-size:11px;letter-spacing:.08em}
#hint{position:fixed;right:14px;bottom:calc(119px + env(safe-area-inset-bottom,0px));padding:6px 11px;border-radius:999px;background:rgba(45,52,64,.75);color:#fff;font:500 12px Nunito,system-ui;pointer-events:none;transition:opacity 1s}
#zoom-controls{position:fixed;right:14px;bottom:calc(53px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:4px;border-radius:18px;background:rgba(45,52,64,.82);box-shadow:0 4px 14px rgba(0,0,0,.14)}
#zoom-controls button{border:0;border-radius:13px;min-width:39px;height:38px;background:rgba(255,255,255,.11);color:#fffdf6;font:600 21px/1 Nunito,system-ui;cursor:pointer;touch-action:manipulation}
#zoom-controls button:active{background:rgba(255,255,255,.32)}
#zoom-controls button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#zoom-controls #sound-toggle{font-size:16px;min-width:38px}
#zoom-controls #rotate-left,#zoom-controls #rotate-right{font-size:20px;min-width:36px}
#zoom-controls #zoom-reset{font-size:12px;letter-spacing:.01em;min-width:43px}
#card-min{position:absolute;top:7px;right:7px;width:28px;height:28px;border:0;border-radius:9px;background:rgba(45,52,64,.08);color:#2d3440;font:600 18px/1 Nunito,system-ui;cursor:pointer;touch-action:manipulation}
#card-min:hover{background:rgba(45,52,64,.15)}
#card-min:focus-visible{outline:2px solid #f6b554;outline-offset:2px}
#card .k,#card .t{padding-right:30px}
/* Minimised: a small pill with the day's title; tap it (or +) to open again. */
#card.min{width:auto;max-width:min(260px,calc(100vw - 28px));padding:7px 40px 7px 12px;border-radius:999px;cursor:pointer}
#card.min>:not(.k):not(.t):not(#card-min){display:none}
#card.min .t{font-size:13px;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:0}
#card.min .k{font-size:9px;padding-right:0}
#card.min #card-min{top:50%;transform:translateY(-50%)}
@media (max-width:600px){#card{top:calc(64px + env(safe-area-inset-top,0px));padding:8px 12px}#card .t{font-size:16px}}
/* Phones: pinch, twist and drag already do this, so only the sound button stays and the hint line goes. */
@media (max-width:700px){#hint{display:none}#zoom-controls #rotate-left,#zoom-controls #rotate-right,#zoom-controls #zoom-out,#zoom-controls #zoom-reset,#zoom-controls #zoom-in{display:none}}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="town" aria-label="Toy Town: a busy little isometric town"></canvas>
<div id="town-3d" aria-hidden="true"></div>
<div id="card"><button id="card-min" type="button" aria-controls="card" aria-expanded="true" aria-label="Minimise news" title="Minimise news">−</button><div class="k">Toy Town · <span id="date"></span><span id="weather"></span></div><div class="t" id="theme">Opening the town…</div><div class="n" id="news"></div>
  <button id="news-toggle" type="button" aria-controls="news-panel" aria-expanded="false"><span id="news-status">CHECKING HEADLINES</span><span aria-hidden="true">↗</span></button>
  <div id="news-headline" role="status">Checking publisher updates…</div>
  <section id="news-panel" aria-label="Publisher headlines" hidden><div id="headlines"></div></section>
</div>
<div id="ticker" role="log" aria-live="polite"><b>AROUND TOWN · FICTION</b><span id="tick">Good morning, Toy Town!</span></div>
<div id="hint">Drag to explore · pinch or scroll to zoom · twist two fingers (or right-drag, Q/E) to turn · tap for a surprise</div>
<div id="zoom-controls" role="group" aria-label="City zoom">
  <button id="sound-toggle" type="button" aria-pressed="false" aria-label="Turn sound on" title="Sound on">🔇</button>
  <button id="rotate-left" type="button" aria-label="Rotate view left" title="Rotate left (Q)">⟲</button>
  <button id="rotate-right" type="button" aria-label="Rotate view right" title="Rotate right (E)">⟳</button>
  <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
  <button id="zoom-reset" type="button" aria-label="Reset city view" title="Fit city">Fit</button>
  <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
</div>
<script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embedded');</script>
<script>
// The news card can be minimised to a small pill. The choice is remembered on
// this device; phones start minimised the first time, since the card would cover most of the town.
(function(){
  const card=document.getElementById('card'),btn=document.getElementById('card-min'),KEY='toy-town:card-min';
  let saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
  const set=(min,store)=>{card.classList.toggle('min',min);btn.textContent=min?'+':'−';
    btn.setAttribute('aria-expanded',String(!min));btn.setAttribute('aria-label',min?'Show news':'Minimise news');btn.title=min?'Show news':'Minimise news';
    if(store)try{localStorage.setItem(KEY,min?'1':'0');}catch(e){}};
  set(saved===null?innerWidth<600:saved==='1',false);
  btn.addEventListener('click',e=>{e.stopPropagation();set(!card.classList.contains('min'),true);});
  card.addEventListener('click',()=>{if(card.classList.contains('min'))set(false,true);});
})();
</script>
<script src="assets/toy-town-diorama.js?v=1"></script>
<script src="assets/toy-town-news.js?v=1"></script>
<script src="assets/toy-town-sound.js?v=5"></script>
<script src="assets/toy-town-weather.js?v=2"></script>
<script src="assets/toy-town.js?v=42"></script>
<script type="module">
  // Opt out with ?classic=1 for the original Canvas experience.
  // Loading errors are deliberately isolated from the existing town engine.
  if (!new URLSearchParams(location.search).has('classic') && window.WebGL2RenderingContext) {
    Promise.all([
      import('three'),
      import('three/addons/geometries/RoundedBoxGeometry.js'),
      import('./assets/toy-town-3d.js?v=72'),
      import('./assets/toy-town-landmarks.js?v=7'),
      // The photographed-miniature lens. Any failure here leaves plain 3D running.
      Promise.all(['EffectComposer','RenderPass','ShaderPass','UnrealBloomPass','OutputPass']
        .map(n => import(`three/addons/postprocessing/${n}.js`).catch(() => ({}))))
        .then(mods => import('./assets/toy-town-lens.js?v=4').then(lens => ({lens, addons: Object.assign({}, ...mods)})))
        .catch(() => null),
      // KayKit CC0 models (buildings, cars, trees, street props) in one file.
      // Without them the town falls back to its hand-built geometry.
      new URLSearchParams(location.search).has('nokit') ? null :
      import('three/addons/loaders/GLTFLoader.js').then(({GLTFLoader}) => new Promise(resolve =>
        new GLTFLoader().load('assets/kaykit/kaykit-town.glb?v=2', gltf => resolve(gltf.scene), undefined, () => resolve(null))))
        .catch(() => null)
    ]).then(([THREE, geometry, view, landmarks, lensKit, kitScene]) => {
      const lensReady = lensKit && !new URLSearchParams(location.search).has('nolens') && lensKit.addons.EffectComposer && lensKit.addons.UnrealBloomPass;
      try { view.mountToyTown3D(THREE, geometry.RoundedBoxGeometry, ToyTown,
        document.getElementById('town-3d'),{buildLandmark:landmarks.buildLandmark,kitScene,
          createLens: lensReady ? (r, sc, cam, o) => lensKit.lens.createLens(THREE, lensKit.addons, r, sc, cam, o) : null}); }
      catch (error) { console.warn('3D is unavailable; classic Toy Town remains active',error); }
    }).catch(error => console.warn('3D resources unavailable; using the 2D town',error));
  }
</script>
</body>
</html>
