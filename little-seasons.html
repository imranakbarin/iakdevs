/* Illustrated-diorama treatment: the stage stays a single, self-contained page. */
html{background:#111d25}

main{position:relative;width:min(94vw,780px)}

.face{border:clamp(6px,1.2vw,9px) solid #314b4e;background:#d8e4cf;box-shadow:inset 0 0 40px #233e4570,0 0 0 2px #f0ead5}
.face:after{box-shadow:inset 0 0 40px #102c3980,inset 0 -18px 32px #142b3733}

#readout{bottom:7%;color:#224848;text-shadow:0 1px 2px #e5ecdb}
#temp{font-weight:250;font-size:clamp(45px,8.5vw,77px);line-height:1.05}
#state{font-size:11px;letter-spacing:.23em}
.seasons{margin-top:19px;gap:8px}
.seasons button{background:#1f353b;border:1px solid #67817b;color:#d9e8e0;padding:10px 17px;transition:background .25s,transform .25s}
.seasons button:hover{transform:translateY(-2px);background:#314f51}
.seasons button[aria-pressed=true]{background:#e4e9d9;color:#294849;border-color:#e4e9d9;box-shadow:0 2px 14px #cbe6c135}
footer{margin-top:16px}
footer button{background:transparent;border:1px solid #657b7d;color:#e2ebe5;padding:9px 13px}
footer label{display:flex;align-items:center;gap:9px;color:#d9e5dd}
footer input{width:min(190px,34vw);accent-color:#d2e3cc}
.hint{color:#b2c5c4;font-size:11px}
#canopy,#house-fill,#snowbank,#night-shade,#windowLight,#tiny-fireflies,#autumn-leaves,#spring-petals{transition:opacity .85s ease}
#windowLight{mix-blend-mode:screen}
#home-architecture,#foreground,#near-meadow{pointer-events:none}

(()=>{'use strict';const $=id=>document.getElementById(id),slider=$('temperature'),temp=$('temp'),state=$('state'),sky=$('background'),weather=$('weather'),leaves=$('leaves'),pond=$('pond'),tree=$('tree'),sun=$('sun'),clouds=$('clouds'),walker=$('walker');let t=8,paused=false,fahrenheit=false,phase=0,last=0,drag=false;const NS='http://www.w3.org/2000/svg';function el(name,attrs,parent){const e=document.createElementNS(NS,name);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e}const stars=Array.from({length:24},(_,i)=>el('circle',{cx:35+(i*79)%530,cy:60+(i*47)%220,r:1.3+(i%3)*.5,fill:'#eaf6f3',opacity:0},$('stars')));const blossoms=Array.from({length:14},(_,i)=>el('circle',{cx:210+(i*37)%125,cy:215+(i*53)%116,r:2.8+(i%3),fill:'#f1d5d9',opacity:0},$('blossoms')));const flowers=Array.from({length:24},(_,i)=>{const x=20+(i*73)%565,y=402+(i*37)%43;const g=el('g',{transform:'translate('+x+' '+y+')'},$('flowers'));el('path',{d:'M0 0v-7',stroke:'#4e8171','stroke-width':1.6},g);el('circle',{cx:0,cy:-9,r:2.5,fill:i%3?'#e7d9a3':'#e9bac3'},g);return g});const ripples=Array.from({length:4},(_,i)=>el('path',{d:'M'+(365+i*43)+' '+(432+i%2*12)+'q10 -5 20 0',opacity:.45},$('ripples')));const birds=Array.from({length:3},(_,i)=>el('path',{d:'M0 0q6 -7 12 0q6 -7 12 0',stroke:'#365e61','stroke-width':2,fill:'none'},$('wildlife')));const drops=Array.from({length:32},(_,i)=>el('path',{class:'line',d:'M0 0l-3 12',opacity:'.4'},weather));const flakes=Array.from({length:28},()=>el('circle',{r:'2.5',fill:'#fff',opacity:'.8'},weather));const foliage=Array.from({length:26},(_,i)=>{const a=i*2.39996,r=18+Math.sqrt(i/26)*74;return el('circle',{cx:275+Math.cos(a)*r,cy:278+Math.sin(a)*r*.8,r:7+(i%4)*2,fill:'#648b76'},leaves)});
const fireflies=Array.from({length:15},(_,i)=>el('circle',{cx:35+(i*61)%525,cy:225+(i*59)%210,r:1.6+(i%3)*.6,fill:'#fff2aa',opacity:0},$('tiny-fireflies')));
const butterflies=Array.from({length:4},(_,i)=>{const g=el('g',{},$('tiny-butterflies'));el('path',{d:'M0 0q-11-12-9-2q4 6 9 2q8-15 10-4q-1 8-10 4Z',fill:i%2?'#f4d49b':'#e8b9aa',stroke:'#8b9979','stroke-width':'1.2'},g);return g});
const fallingLeaves=Array.from({length:20},(_,i)=>el('ellipse',{rx:2.5+(i%3),ry:5+(i%2),fill:['#c9854e','#daae66','#a77b55'][i%3],opacity:0},$('autumn-leaves')));
const petals=Array.from({length:18},(_,i)=>el('circle',{r:2.2+(i%3),fill:i%2?'#f0c0cb':'#f7e3e3',opacity:0},$('spring-petals')));
const waterShimmer=$('water-shimmer'),ducks=$('floating-ducks'),nightShade=$('night-shade'),windowLight=$('windowLight');
function update(){t=Number(slider.value);const winter=t<=1,autumn=t>=23,summer=t>=14&&!autumn;const season=winter?'WINTER':autumn?'AUTUMN':summer?'SUMMER':'SPRING';document.querySelectorAll('[data-season]').forEach(b=>b.setAttribute('aria-pressed',String((winter&&Number(b.dataset.season)<0)||(!winter&&!summer&&!autumn&&Number(b.dataset.season)===8)||(summer&&Number(b.dataset.season)===19)||(autumn&&Number(b.dataset.season)===29))));$('canopy').style.opacity=winter?'0':autumn?'.85':summer?'1':'.75';$('canopy').querySelectorAll('ellipse,circle').forEach((e,i)=>e.setAttribute('fill',autumn?['#d49a58','#bd784f','#e1b26c','#b86d4c'][i]:summer?['#5b997b','#6ca783','#4d8d72','#7caf82'][i]:['#9bc4a5','#b6d1ae','#87b9a1','#c1d9b4'][i]));$('snowbank').firstElementChild.setAttribute('opacity',winter?'.94':'0');$('house-fill').querySelector('path').setAttribute('fill',winter?'#edf3ef':autumn?'#f3dfc1':summer?'#f7e9bf':'#f4ead3');$('farland').setAttribute('opacity',winter?'.55':'1');state.textContent=(winter?'FREEZE':autumn?'GOLDEN':summer?'WARM':'THAW')+' · '+season;temp.textContent=(fahrenheit?Math.round(t*9/5+32):t)+'°'+(fahrenheit?'F':'C');sky.setAttribute('fill',winter?'#c5dce4':autumn?'#e4d9b5':summer?'#b9e0cc':'#b5d9d8');document.querySelector('#sky stop').setAttribute('stop-color',winter?'#eff7f7':autumn?'#f5e6c3':summer?'#e9efd2':'#d9eee0');document.querySelector('#sky stop[offset="1"]').setAttribute('stop-color',winter?'#a8c9d9':autumn?'#d8bc99':summer?'#94cdbd':'#9fcbd2');foliage.forEach((e,i)=>{e.style.display=winter?'none':'';e.setAttribute('fill',autumn?['#bd8a55','#d6a85d','#aa7756'][i%3]:summer?'#638f73':'#90b7a0');e.setAttribute('opacity',summer?'1':'.82')});pond.querySelector('ellipse').setAttribute('fill',winter?'#e9f5f6':'#a5d7d3');tree.setAttribute('stroke',autumn?'#806d57':'#365e61');flowers.forEach(e=>e.style.opacity=winter?'.05':autumn?'.3':summer?'1':'.8');blossoms.forEach(e=>e.setAttribute('opacity',!winter&&!autumn&&!summer?'.9':'0'));birds.forEach(e=>e.style.display=winter?'none':'');$('meadow-base').setAttribute('fill',winter?'#d6e3df':autumn?'#b69f70':summer?'#78ac83':'url(#pasture)');$('garden-path').setAttribute('fill',winter?'#eae5d5':autumn?'#c9aa7f':'#e2d4ac');$('tree-highlights').setAttribute('opacity',winter?'0':autumn?'.2':summer?'.6':'.8');fallingLeaves.forEach(e=>e.style.display=autumn?'':'none');petals.forEach(e=>e.style.display=(!winter&&!summer&&!autumn)?'':'none');butterflies.forEach(e=>e.style.display=(winter||autumn)?'none':'');document.querySelector('meta[name="theme-color"]').setAttribute('content',winter?'#b5cbd4':autumn?'#d6ba91':summer?'#9fcfba':'#cbdfe0');}document.querySelectorAll('[data-season]').forEach(b=>b.addEventListener('click',()=>{slider.value=b.dataset.season;update()}));slider.addEventListener('input',update);$('unit').addEventListener('click',()=>{fahrenheit=!fahrenheit;update()});$('play').addEventListener('click',()=>{paused=!paused;$('play').textContent=paused?'Resume motion':'Pause motion';$('play').setAttribute('aria-pressed',String(!paused))});const scene=$('scene');scene.addEventListener('pointerdown',e=>{drag=true;scene.setPointerCapture(e.pointerId)});scene.addEventListener('pointermove',e=>{if(!drag)return;const rect=scene.getBoundingClientRect();slider.value=Math.max(-10,Math.min(40,Math.round((e.clientX-rect.left)/rect.width*50-10)));update()});scene.addEventListener('pointerup',()=>drag=false);scene.addEventListener('pointercancel',()=>drag=false);function frame(ms){if(!last)last=ms;const dt=Math.min((ms-last)/1000,.05);last=ms;if(!paused)phase+=dt;const nightLevel=Math.max(0,Math.min(.47,(-Math.sin(phase*.045)-.22)*.64));const night=nightLevel>.23;nightShade.setAttribute('opacity',nightLevel.toFixed(3));windowLight.setAttribute('opacity',(.14+nightLevel*1.6).toFixed(2));$('sun-aura').setAttribute('opacity',(.68-nightLevel).toFixed(2));stars.forEach((e,i)=>e.setAttribute('opacity',night?(.4+.35*Math.sin(phase*1.1+i)**2):0));sun.setAttribute('opacity',night?'.28':'1');$('house-fill').querySelector('rect').setAttribute('fill',night?'#eec77b':'#a7c9c3');const winter=t<=1,wet=(t>1&&t<13)||(t>=23&&t<27);$('chimney-smoke').setAttribute('opacity',winter?'1':'.28');sun.setAttribute('transform','translate('+(445+Math.sin(phase*.13)*25)+' '+(135+Math.cos(phase*.16)*12)+')');clouds.setAttribute('transform','translate('+(Math.sin(phase*.17)*17)+' 0)');const step=Math.sin(phase*2.4),walkX=16+Math.sin(phase*.13)*53,bob=Math.abs(step)*1.3;walker.setAttribute('transform','translate('+walkX+' '+bob+')');$('leg-left').setAttribute('transform','rotate('+(step*15)+' 122 429)');$('leg-right').setAttribute('transform','rotate('+(-step*15)+' 130 429)');$('person-arms').setAttribute('transform','rotate('+(-step*4)+' 126 408)');$('dog-tail').setAttribute('transform','rotate('+(Math.sin(phase*3.3)*14)+' 198 428)');$('dog-front').setAttribute('transform','translate(0 '+(Math.abs(step)*1.1)+')');drops.forEach((e,i)=>{e.style.display=wet?'':'none';const x=(i*83+phase*45)%620-10,y=(i*71+phase*115)%365+50;e.setAttribute('transform','translate('+x+' '+y+')')});flakes.forEach((e,i)=>{e.style.display=winter?'':'none';const x=(i*79+Math.sin(phase+i)*12)%610,y=(i*61+phase*19)%400+35;e.setAttribute('cx',x);e.setAttribute('cy',y)});foliage.forEach((e,i)=>e.setAttribute('transform','translate('+(Math.sin(phase*1.2+i)*1.6)+' 0)'));ripples.forEach((e,i)=>e.setAttribute('transform','translate('+(Math.sin(phase*1.1+i)*3)+' 0)'));birds.forEach((e,i)=>e.setAttribute('transform','translate('+((phase*(9+i*3)+i*150)%750-100)+' '+(145+i*23+Math.sin(phase*1.5+i)*8)+') scale(.7)'));const autumn=t>=23,spring=t>1&&t<14;
fallingLeaves.forEach((e,i)=>{if(!autumn)return;const x=185+(i*47+phase*(10+i%4*3))%190,y=200+(i*43+phase*(13+i%3*6))%208;e.setAttribute('cx',x);e.setAttribute('cy',y);e.setAttribute('transform','rotate('+(phase*65+i*32)+' '+x+' '+y+')');e.setAttribute('opacity',.4+Math.sin(phase+i)**2*.4)});
petals.forEach((e,i)=>{if(!spring)return;const x=206+(i*41+phase*9)%125,y=219+(i*39+phase*(8+i%3*2))%190;e.setAttribute('cx',x+Math.sin(phase+i)*10);e.setAttribute('cy',y);e.setAttribute('opacity',.34+Math.sin(i+phase)**2*.46)});
butterflies.forEach((e,i)=>{e.setAttribute('transform','translate('+(60+i*126+Math.sin(phase*.7+i)*20)+' '+(353+i%2*32+Math.cos(phase*.9+i)*14)+') scale('+(1+Math.sin(phase*9+i)*.16)+')')});
fireflies.forEach((e,i)=>{e.setAttribute('opacity',night?(.1+Math.max(0,Math.sin(phase*1.6+i*2.4))*.75):'0');e.setAttribute('transform','translate('+(Math.sin(phase*.8+i)*7)+' '+(Math.cos(phase*.8+i)*7)+')')});

requestAnimationFrame(frame)}if(matchMedia('(prefers-reduced-motion: reduce)').matches){paused=true;$('play').textContent='Resume motion';$('play').setAttribute('aria-pressed','false')}update();requestAnimationFrame(frame)})();
