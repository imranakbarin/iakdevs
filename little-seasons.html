<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Little Seasons — Living Dial</title><meta name="theme-color" content="#cbdfe0"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:#101b22;color:#e8f2f2}body{display:grid;place-items:center;padding:24px 12px 34px;background:radial-gradient(ellipse at 50% 40%,#364953,#101820 78%)}main{width:min(95vw,740px);text-align:center}header{margin-bottom:16px}h1{font:400 clamp(23px,4vw,35px) Georgia,serif;letter-spacing:.04em;margin:0 0 5px}p{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#a9bdc2;margin:0}.dial{position:relative;width:100%;aspect-ratio:1;border-radius:50%;padding:5.3%;background:repeating-radial-gradient(circle at 48% 46%,#b2c5d0 0 1px,#829aa8 2px 4px,#d7e5eb 5px 7px);box-shadow:0 22px 75px #0009,inset 0 0 8px #fff,0 0 0 2px #0c171e}.face{width:100%;height:100%;border:clamp(5px,1.3vw,10px) solid #263b49;border-radius:50%;overflow:hidden;position:relative;background:#b5d9d8;box-shadow:inset 0 0 25px #193b4555,0 0 0 3px #8fa7b3}svg{width:100%;height:100%;display:block;touch-action:pan-y}#scene{cursor:ew-resize}svg .line{stroke:#365e61;stroke-width:3.3;stroke-linecap:round;stroke-linejoin:round;fill:none}svg .solid{fill:#365e61}#readout{position:absolute;bottom:9%;left:0;right:0;pointer-events:none;color:#244b50}#temp{font:300 clamp(42px,9vw,82px) system-ui,sans-serif;letter-spacing:-.07em}#state{font:700 12px system-ui;letter-spacing:.17em}footer{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:20px}button{border:1px solid #79949d;border-radius:99px;background:#1b303b;color:#e5f0f1;padding:11px 18px;font-size:13px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #e3edc5;outline-offset:3px}label{font-size:13px;color:#d4e4e8}input{width:min(230px,50vw);accent-color:#b6d7d2;vertical-align:middle}.hint{margin-top:13px;letter-spacing:normal;text-transform:none;color:#a5b7bc;font-size:12px}@media(max-width:500px){body{padding:14px 7px}.dial{width:100%}footer{gap:8px}button{padding:10px 13px}}
</style></head><body><main><header><h1>Little Seasons</h1><p>A tiny world inside a living dial</p></header><div class="dial"><div class="face"><svg id="scene" viewBox="0 0 600 600" role="img" aria-label="Animated seasonal landscape with a home, tree, pond, person and dog"><defs><radialGradient id="sky"><stop stop-color="#d9eee0"/><stop offset="1" stop-color="#9fcbd2"/></radialGradient><clipPath id="round"><circle cx="300" cy="300" r="299"/></clipPath></defs><g clip-path="url(#round)"><rect width="600" height="600" fill="url(#sky)" id="background"/><g id="weather"></g><g class="line" id="clouds"><path d="M95 151h96q13 0 11-12t-17-10q-8-25-27-12-13-26-32 0-25-6-26 18-16-1-5 16Z"/><path d="M355 104h83q11-1 8-12-4-9-16-7-10-21-26-8-12-24-28-1-20-3-21 17-14 0 0 11Z"/></g><g id="sun" transform="translate(445 135)"><circle r="22" fill="#365e61"/><g stroke="#365e61" stroke-width="3"><path d="M0-37v-9M0 37v9M-37 0h-9M37 0h9M-26-26l-7-7M26 26l7 7M-26 26l-7 7M26-26l7-7"/></g></g><path class="line" d="M0 364Q85 230 173 346T360 365" id="hill"/><path class="line" d="M0 395Q250 386 600 407"/><g id="tree" class="line"><path d="M275 397V248M275 316l-47-61M275 288l33-66M275 353l46-57M275 274l-17-39"/></g><g id="leaves"></g><g class="line" id="house"><path d="M360 391v-102l83-62 85 64v107M349 293l94-79 97 82H349Z"/><path d="M480 242v-25h18v41M380 391v-62h52v62M460 391v-47h44v47M389 342h33M405 330v61"/><circle cx="494" cy="369" r="2" fill="#365e61"/></g><g id="pond"><ellipse cx="440" cy="438" rx="124" ry="29" fill="#a5d7d3" stroke="#365e61" stroke-width="3"/><path class="line" d="M380 446q13-9 24 0m72-2q12-8 25 0M553 440l12-43m-11 42 24-29"/></g><g id="walker" class="line"><circle cx="126" cy="390" r="7" fill="#365e61"/><path d="M126 400v31l-9 20m9-20 12 20m-12-43-13 16m13-16 19 11"/><path d="M146 422q14-12 25 1"/><g id="dog"><path d="M173 430h24l8 15m-29-15-5 16m25-16-1 16m-22-16-8-8-10 3 8 9m35-7 10-11"/><circle cx="162" cy="425" r="2" fill="#365e61"/></g></g><g id="ground" class="line"><path d="M0 458h600M55 451l5-8 5 8m170 0 4-7 4 7m40-4 5-9 4 9"/></g><g id="marks" fill="#365e61" font-size="13" font-family="system-ui" text-anchor="middle"><text x="300" y="50">20</text><text x="54" y="300">10</text><text x="550" y="300">30</text><text x="300" y="558">40</text></g></g></svg><div id="readout"><div id="temp">8°C</div><div id="state">THAW · SPRING</div></div></div></div><footer><button id="play" type="button" aria-pressed="true">Pause motion</button><label for="temperature">Temperature <input id="temperature" type="range" min="-10" max="40" value="8" step="1"></label><button id="unit" type="button">°C / °F</button></footer><p class="hint">Slide to change the season · drag the dial · watch the world respond</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),slider=$('temperature'),temp=$('temp'),state=$('state'),sky=$('background'),weather=$('weather'),leaves=$('leaves'),pond=$('pond'),tree=$('tree'),sun=$('sun'),clouds=$('clouds'),walker=$('walker');let t=8,paused=false,fahrenheit=false,phase=0,last=0,drag=false;const NS='http://www.w3.org/2000/svg';function el(name,attrs,parent){const e=document.createElementNS(NS,name);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e}const drops=Array.from({length:32},(_,i)=>el('path',{class:'line',d:'M0 0l-3 12',opacity:'.4'},weather));const flakes=Array.from({length:28},()=>el('circle',{r:'2.5',fill:'#fff',opacity:'.8'},weather));const foliage=Array.from({length:26},(_,i)=>{const a=i*2.39996,r=18+Math.sqrt(i/26)*74;return el('circle',{cx:275+Math.cos(a)*r,cy:278+Math.sin(a)*r*.8,r:7+(i%4)*2,fill:'#648b76'},leaves)});function update(){t=Number(slider.value);const winter=t<=1,autumn=t>=23,summer=t>=14&&!autumn;const season=winter?'WINTER':autumn?'AUTUMN':summer?'SUMMER':'SPRING';state.textContent=(winter?'FREEZE':autumn?'GOLDEN':summer?'WARM':'THAW')+' · '+season;temp.textContent=(fahrenheit?Math.round(t*9/5+32):t)+'°'+(fahrenheit?'F':'C');sky.setAttribute('fill',winter?'#c5dce4':autumn?'#e4d9b5':summer?'#b9e0cc':'#b5d9d8');document.querySelector('#sky stop').setAttribute('stop-color',winter?'#eff7f7':autumn?'#f5e6c3':summer?'#e9efd2':'#d9eee0');document.querySelector('#sky stop[offset="1"]').setAttribute('stop-color',winter?'#a8c9d9':autumn?'#d8bc99':summer?'#94cdbd':'#9fcbd2');foliage.forEach((e,i)=>{e.style.display=winter?'none':'';e.setAttribute('fill',autumn?['#bd8a55','#d6a85d','#aa7756'][i%3]:summer?'#638f73':'#90b7a0');e.setAttribute('opacity',summer?'1':'.82')});pond.querySelector('ellipse').setAttribute('fill',winter?'#e9f5f6':'#a5d7d3');tree.setAttribute('stroke',autumn?'#806d57':'#365e61');}slider.addEventListener('input',update);$('unit').addEventListener('click',()=>{fahrenheit=!fahrenheit;update()});$('play').addEventListener('click',()=>{paused=!paused;$('play').textContent=paused?'Resume motion':'Pause motion';$('play').setAttribute('aria-pressed',String(!paused))});const scene=$('scene');scene.addEventListener('pointerdown',e=>{drag=true;scene.setPointerCapture(e.pointerId)});scene.addEventListener('pointermove',e=>{if(!drag)return;const rect=scene.getBoundingClientRect();slider.value=Math.max(-10,Math.min(40,Math.round((e.clientX-rect.left)/rect.width*50-10)));update()});scene.addEventListener('pointerup',()=>drag=false);scene.addEventListener('pointercancel',()=>drag=false);function frame(ms){if(!last)last=ms;const dt=Math.min((ms-last)/1000,.05);last=ms;if(!paused)phase+=dt;const winter=t<=1,wet=t>1&&t<14;sun.setAttribute('transform','translate('+(445+Math.sin(phase*.13)*25)+' '+(135+Math.cos(phase*.16)*12)+')');clouds.setAttribute('transform','translate('+(Math.sin(phase*.17)*17)+' 0)');walker.setAttribute('transform','translate('+(Math.sin(phase*.33)*28)+' '+(Math.abs(Math.sin(phase*4))*1.5)+')');drops.forEach((e,i)=>{e.style.display=wet?'':'none';const x=(i*83+phase*45)%620-10,y=(i*71+phase*115)%365+50;e.setAttribute('transform','translate('+x+' '+y+')')});flakes.forEach((e,i)=>{e.style.display=winter?'':'none';const x=(i*79+Math.sin(phase+i)*12)%610,y=(i*61+phase*19)%400+35;e.setAttribute('cx',x);e.setAttribute('cy',y)});foliage.forEach((e,i)=>e.setAttribute('transform','translate('+(Math.sin(phase*1.2+i)*1.6)+' 0)'));requestAnimationFrame(frame)}update();requestAnimationFrame(frame)})();
</script></body></html>
