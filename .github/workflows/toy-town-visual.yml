name: Toy Town WebGL visual check

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/toy-town-3d.js'
      - 'assets/toy-town-country.js'
      - 'assets/toy-town-diorama.js'
      - 'tests/toy-town-country.test.cjs'
      - 'assets/toy-town-landmarks.js'
      - 'assets/toy-town-lens.js'
      - 'assets/toy-town-sound.js'
      - 'assets/toy-town-weather.js'
      - 'assets/kaykit/**'
      - 'tests/toy-town-lens.test.cjs'
      - 'tests/toy-town-extras.test.cjs'
      - 'assets/toy-town.js'
      - 'assets/toy-town-news.js'
      - 'toy-town.html'
      - 'tests/toy-town-visual.cjs'
      - 'tests/toy-town-3d.test.cjs'
      - 'tests/toy-town.test.cjs'
      - 'tests/toy-town-rain.test.cjs'
      - 'tests/toy-town-bridges.test.cjs'
      - 'scripts/check-toy-town.cjs'
      - 'assets/town2/**'
      - 'toy-town-new.html'
      - 'tests/toy-town-new.test.cjs'
      - 'tests/toy-town-new-visual.cjs'
      - 'tests/toy-town-characters.cjs'
      - 'tests/toy-town-living.cjs'
      - '.github/workflows/toy-town-visual.yml'

permissions:
  contents: read

jobs:
  town-logic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify town logic, camera controls and 3D environment
        run: node scripts/check-toy-town.cjs

  # Both jobs are mandatory; render checks do not depend on logic outputs.
  real-browser-screenshots:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-24.04   # ubuntu-latest became 26.04, which Playwright 1.58 does not support
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test real WebGL and capture close-up views
        env:
          TOWN_VISUAL_SHARDS: 2
          TOWN_VISUAL_SHARD: ${{ matrix.shard }}
        run: node tests/toy-town-visual.cjs
      - name: Render the new storybook town (real WebGL)
        if: matrix.shard == 0
        run: node tests/toy-town-new-visual.cjs
      - name: Check residents, horse and wildlife (real WebGL)
        if: matrix.shard == 1
        run: node tests/toy-town-characters.cjs
      - name: Keep rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toy-town-visual-${{ github.run_number }}-${{ matrix.shard }}
          path: visual-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # The living-town film runs for several simulated hours. Run it separately so
  # the regular visual shard does not hit the combined 15-minute job timeout.
  living-town:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check the living town (activities, doors, trains, animals)
        run: node tests/toy-town-living.cjs
      - name: Keep living-town screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toy-town-living-${{ github.run_number }}
          path: visual-artifacts/
          if-no-files-found: ignore
          retention-days: 14
