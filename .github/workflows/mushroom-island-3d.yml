name: Mushroom Island 3D checks
on:
  push:
    paths:
      - 'mushroom-island.html'
      - 'assets/mushroom-island-3d.mjs'
      - 'assets/mushroom-cinematic.js'
      - 'assets/mushroom-life.js'
      - 'tests/mushroom-island-3d.test.cjs'
      - '.github/workflows/mushroom-island-3d.yml'
  pull_request:
    paths:
      - 'mushroom-island.html'
      - 'assets/mushroom-island-3d.mjs'
      - 'assets/mushroom-cinematic.js'
      - 'assets/mushroom-life.js'
      - 'tests/mushroom-island-3d.test.cjs'
      - '.github/workflows/mushroom-island-3d.yml'
jobs:
  check-3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check 3D world source and preserved 2D fallback
        run: node tests/mushroom-island-3d.test.cjs
